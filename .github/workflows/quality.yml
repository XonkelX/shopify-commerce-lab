name: Theme quality

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: ./theme
          flags: --fail-level warning
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}

  repository-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON, schemas, and quality invariants
        shell: pwsh
        run: ./scripts/verify-phase-7.ps1 -SkipThemeCheck

  app-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_sync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_sync?schema=public
    defaults:
      run:
        working-directory: inventory-sync-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inventory-sync-monitor/package-lock.json
      - run: npm ci
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
