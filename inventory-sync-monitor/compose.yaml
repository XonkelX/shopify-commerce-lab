services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_sync
      POSTGRES_USER: inventory_sync
      POSTGRES_PASSWORD: inventory_sync
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_sync -d inventory_sync"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - inventory-sync-postgres:/var/lib/postgresql/data

volumes:
  inventory-sync-postgres:
